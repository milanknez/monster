<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Monster Detail - Volt-Rat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0db9f2",
                        "secondary": "#a3e635",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101e22",
                        "surface-dark": "#182d34",
                        "border-dark": "#223f49",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 backdrop-blur-md bg-opacity-80">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full bg-slate-200 dark:bg-surface-dark cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Monster Detail</h2>
<div class="flex w-10 items-center justify-end">
<button class="flex cursor-pointer items-center justify-center rounded-full size-10 bg-slate-200 dark:bg-surface-dark text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">share</span>
</button>
</div>
</div>
<!-- Hero Image Section -->
<div class="@container">
<div class="px-4 py-3">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-xl min-h-80 shadow-lg shadow-primary/20 border-2 border-primary/30" data-alt="A glowing neon electric rodent with sparks" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA5m91Na5FCnuXQ0KBXkGtmg9hJ2HzDQSd3-mIYGuNvNRoDjeMnrqE8cha3d-sSHbS1aWIdP-AePkvw7soCfKgIBbY9TmbE3cGhlNOT-t-jzV3FQe1D5y_rnIIFVtzITIOzPhkJ9UiMytwI5fvirh9I6M4_81VtB7dEtbLNjf1QRgJfddTLs-rsXNLYXZX2X6YyFE272v6UXoqlQMulVm7imZ_p-tdQSlLGGD_o5bvhNDBplbvT9R4XB42-OuPER_nCSjJa8fSEIywb");'>
<div class="bg-gradient-to-t from-background-dark via-transparent to-transparent h-32 w-full"></div>
</div>
</div>
</div>
<!-- Identity Section -->
<div class="px-4 py-2">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-4xl font-bold leading-tight">Volt-Rat</h1>
<div class="flex gap-3 mt-3 flex-wrap">
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/20 border border-primary/40 px-3">
<span class="material-symbols-outlined text-primary text-lg">bolt</span>
<p class="text-primary text-sm font-bold uppercase tracking-wider">Electric</p>
</div>
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-secondary/20 border border-secondary/40 px-3">
<span class="material-symbols-outlined text-secondary text-lg">star</span>
<p class="text-secondary text-sm font-bold uppercase tracking-wider">Common</p>
</div>
</div>
</div>
<!-- Stats Section -->
<div class="px-4 py-6 space-y-4">
<h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest">Base Stats</h3>
<div class="grid gap-4">
<!-- Attack -->
<div class="space-y-1">
<div class="flex justify-between text-sm mb-1">
<span class="text-slate-900 dark:text-slate-300">Attack</span>
<span class="font-bold text-primary">74 / 100</span>
</div>
<div class="w-full bg-surface-dark rounded-full h-2.5 overflow-hidden">
<div class="bg-primary h-full rounded-full shadow-[0_0_10px_#0db9f2]" style="width: 74%"></div>
</div>
</div>
<!-- Speed -->
<div class="space-y-1">
<div class="flex justify-between text-sm mb-1">
<span class="text-slate-900 dark:text-slate-300">Speed</span>
<span class="font-bold text-secondary">92 / 100</span>
</div>
<div class="w-full bg-surface-dark rounded-full h-2.5 overflow-hidden">
<div class="bg-secondary h-full rounded-full shadow-[0_0_10px_#a3e635]" style="width: 92%"></div>
</div>
</div>
<!-- Energy -->
<div class="space-y-1">
<div class="flex justify-between text-sm mb-1">
<span class="text-slate-900 dark:text-slate-300">Energy</span>
<span class="font-bold text-primary">45 / 100</span>
</div>
<div class="w-full bg-surface-dark rounded-full h-2.5 overflow-hidden">
<div class="bg-primary h-full rounded-full shadow-[0_0_10px_#0db9f2]" style="width: 45%"></div>
</div>
</div>
</div>
</div>
<!-- Abilities Section -->
<div class="px-4 py-4 mb-24">
<h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-4">Abilities</h3>
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-dark p-4 rounded-xl border border-border-dark flex items-center gap-3">
<div class="size-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">flash_on</span>
</div>
<div>
<p class="font-bold text-sm">Static Shock</p>
<p class="text-xs text-slate-400">Paralyze enemy</p>
</div>
</div>
<div class="bg-surface-dark p-4 rounded-xl border border-border-dark flex items-center gap-3">
<div class="size-10 rounded-lg bg-secondary/10 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">speed</span>
</div>
<div>
<p class="font-bold text-sm">Quick Dash</p>
<p class="text-xs text-slate-400">Avoid next hit</p>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="fixed bottom-20 left-0 right-0 p-4 grid grid-cols-2 gap-4 bg-gradient-to-t from-background-dark via-background-dark to-transparent pb-6">
<button class="flex h-14 items-center justify-center rounded-xl bg-surface-dark border border-border-dark text-slate-100 font-bold uppercase tracking-wider text-sm transition-all hover:bg-slate-800">
                Back to Bestiary
            </button>
<button class="flex h-14 items-center justify-center rounded-xl bg-primary text-background-dark font-black uppercase tracking-wider text-sm shadow-lg shadow-primary/40 active:scale-95 transition-all">
                Upgrade Now
            </button>
</div>
<!-- Bottom Nav Bar -->
<div class="fixed bottom-0 w-full flex gap-2 border-t border-border-dark bg-surface-dark px-4 pb-3 pt-2">
<a class="just flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">house</span>
</div>
</a>
<a class="just flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">swords</span>
</div>
</a>
<a class="just flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">menu_book</span>
</div>
</a>
<a class="just flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">trending_up</span>
</div>
</a>
<a class="just flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">person</span>
</div>
</a>
</div>
</div>
</body></html>

name: Android Deploy

on:
  push:
    branches:
      - master
      - test
      - closed
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Update Android Version
        run: |
          # Version code musí být vždy vyšší než to, co už je v Google Play (teď tam máš 107)
          # Použijeme základ 1000, aby se to nikdy nepotkalo s tvým ručním číslováním.
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          
          # Název verze nastavíme na 1.1.x (nebo použijeme tag)
          VERSION_NAME="1.1.${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME=${GITHUB_REF_NAME#v}
          fi
          
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign AAB
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Determine Track
        id: determine_track
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "track=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/closed" || "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "track=alpha" >> $GITHUB_OUTPUT
          else
            echo "track=internal" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.monster.collector
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          tracks: ${{ steps.determine_track.outputs.track }}
          status: completed
